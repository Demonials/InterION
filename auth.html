<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InterION Secure Sign-in</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f8;color:#171b24;font-family:Inter,system-ui,sans-serif;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #e4e8ee;border-radius:20px;padding:34px;text-align:center}.brand{font-size:22px;font-weight:850}.muted{color:#687386;line-height:1.6}button{border:0;border-radius:10px;padding:13px 20px;background:#171b24;color:white;font-weight:750;cursor:pointer}#msg{min-height:24px;color:#b42318;overflow-wrap:anywhere}</style></head>
<body><main class="card"><div class="brand">⚡ INTERION</div><h1>Secure sign-in</h1><p class="muted">Authenticate with Google. When complete, your sign-in will be returned securely to the local InterION window.</p><button id="signin">Continue with Google</button><p id="msg"></p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const msg=document.getElementById('msg'),button=document.getElementById('signin'),params=new URLSearchParams(location.search),origin=params.get('origin'),state=params.get('state');
if(!origin||!state||!/^https?:\\/\\/(localhost|127\\.0\\.0\\.1|(?:192\\.168\\.|10\\.)|172\\.(?:1[6-9]|2[0-9]|3[01])\\.)/.test(origin)){button.disabled=true;msg.textContent='Invalid local sign-in request. Start again from InterION.';}
try{const r=await fetch('/api/config.js',{cache:'no-store'});if(!r.ok)throw Error('Cloud config unavailable ('+r.status+')');const cfg=await r.json();const auth=getAuth(initializeApp(cfg));button.onclick=async()=>{button.disabled=true;msg.textContent='Waiting for Google…';try{const result=await signInWithPopup(auth,new GoogleAuthProvider());const idToken=await result.user.getIdToken(true);if(!window.opener||window.opener.closed)throw Error('Local InterION window is no longer available.');window.opener.postMessage({type:'INTERION_AUTH',state,idToken},origin);msg.textContent='Signed in. You can close this window.';setTimeout(()=>window.close(),700);}catch(e){msg.textContent=e.message;button.disabled=false;}};}catch(e){button.disabled=true;msg.textContent=e.message;}
</script></body></html>
